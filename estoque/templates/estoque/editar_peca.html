<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .container { max-width: 800px; }
        .form-input { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        
        <div class="mb-8 bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Editando: {{ peca.nome }}</h1>
            <a href="{% url 'lista_pecas' %}" class="text-indigo-600 hover:text-indigo-800">Cancelar e Voltar</a>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-lg">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <!-- Tratamento de erros gerais -->
                {% if form.non_field_errors %}
                    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
                        <p class="font-bold">Erro!</p>
                        {% for error in form.non_field_errors %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
                
                {% for field in form %}
                    <div class="grid grid-cols-1 gap-2">
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-500 text-xs italic">{{ field.errors }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition">
                    Salvar Alterações
                </button>
            </form>
        </div>

    </div>
</body>
</html>
