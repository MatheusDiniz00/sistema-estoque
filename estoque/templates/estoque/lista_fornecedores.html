<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; } .container { max-width: 1200px; } </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        
        <div class="mb-6 bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 mb-1">{{ titulo }}</h1>
                <p class="text-gray-600">Parceiros e fornecedores de peças.</p>
            </div>
            <div class="flex gap-2">
                <a href="{% url 'lista_pecas' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition">
                    Voltar
                </a>
                <a href="{% url 'adicionar_fornecedor' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded shadow transition">
                    + Novo Fornecedor
                </a>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    {% for forn in fornecedores %}
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ forn.nome }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ forn.telefone|default:"-" }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ forn.email|default:"-" }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <a href="{% url 'editar_fornecedor' forn.pk %}" class="text-indigo-600 hover:text-indigo-900 font-bold">Editar</a>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-gray-500 italic">
                                Nenhum fornecedor cadastrado.
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
