<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
        }
        .container {
            max-width: 800px;
        }
        /* Estilos básicos para formulário, adaptando os widgets do Django */
        .form-input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        
        <!-- Cabeçalho -->
        <div class="mb-8 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ titulo }}</h1>
            <a href="{% url 'lista_pecas' %}" class="text-indigo-600 hover:text-indigo-800 transition duration-150">← Voltar para a Lista</a>
        </div>

        <!-- Mensagens do Django (ex: Sucesso ao cadastrar) -->
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded" role="alert">
                        <p class="font-bold">Sucesso!</p>
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Card do Formulário -->
        <div class="bg-white p-8 rounded-lg shadow-lg">
            <form method="post" action="{% url 'adicionar_peca' %}" class="space-y-6">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="grid grid-cols-1 gap-2">
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-500 text-xs italic">{{ field.errors }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                    Salvar Peça no Estoque
                </button>
            </form>
        </div>

    </div>
</body>
</html>
