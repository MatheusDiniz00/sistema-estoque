<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .container { max-width: 800px; }
        .form-select, .form-input, .form-textarea { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; width: 100%; border-radius: 0.375rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        
        <div class="mb-8 bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">{{ titulo }}</h1>
            <a href="{% url 'lista_pecas' %}" class="text-indigo-600 hover:text-indigo-800">Cancelar e Voltar</a>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-lg">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                {% if messages %}
                    <div class="mb-4">
                        {% for message in messages %}
                            <div class="p-4 rounded {% if 'error' in message.tags %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peça</label>
                        {{ form.peca }}
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Movimentação</label>
                        {{ form.tipo }}
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quantidade</label>
                        {{ form.quantidade_movimentada }}
                    </div>

                    <!-- Novo Campo de Fornecedor -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fornecedor (Opcional, apenas para Entradas)</label>
                        {{ form.fornecedor }}
                        <p class="text-xs text-gray-500 mt-1">De quem compramos esta peça?</p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Observação</label>
                    {{ form.observacao }}
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition">
                    Confirmar Movimentação
                </button>
            </form>
        </div>

    </div>
</body>
</html>
