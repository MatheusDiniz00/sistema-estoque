<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>

                /* Força altura igual para todos selects */
        select.form-select {
            height: 42px;
        }

        /* Select2 container */
        .select2-container {
            width: 100% !important;
        }

        /* Caixa principal */
        .select2-container .select2-selection--single {
            height: 42px !important;
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            display: flex !important;
            align-items: center !important;
        }

        /* Texto interno */
        .select2-selection__rendered {
            line-height: 42px !important;
            padding-left: 12px !important;
        }

        /* Seta */
        .select2-selection__arrow {
            height: 42px !important;
        }


        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
        }

        .container {
            max-width: 800px;
        }

        .form-select,
        .form-input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            width: 100%;
            border-radius: 0.375rem;
            height: 42px;
        }

        .form-textarea {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            width: 100%;
            border-radius: 0.375rem;
            resize: vertical;
        }


        /* ===== Ajuste visual do Select2 ===== */

        .select2-selection__rendered {
            line-height: normal !important;
            padding-left: 12px !important;
        }

        .select2-selection__arrow {
            height: 100% !important;
        }

        .select2-container--default.select2-container--focus .select2-selection--single {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 1px #6366f1 !important;
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <div class="container mx-auto">
        
        <div class="mb-8 bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">{{ titulo }}</h1>
            <a href="{% url 'lista_pecas' %}" class="text-indigo-600 hover:text-indigo-800">
                Cancelar e Voltar
            </a>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-lg">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                {% if messages %}
                    <div class="mb-4">
                        {% for message in messages %}
                            <div class="p-4 rounded {% if 'error' in message.tags %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peça</label>
                        {{ form.peca }}
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Tipo de Movimentação
                        </label>
                        {{ form.tipo }}
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Quantidade
                        </label>
                        {{ form.quantidade_movimentada }}
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Fornecedor (Opcional, apenas para Entradas)
                        </label>
                        {{ form.fornecedor }}
                        <p class="text-xs text-gray-500 mt-1">
                            De quem compramos esta peça?
                        </p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Observação
                    </label>
                    {{ form.observacao }}
                </div>

                <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition">
                    Confirmar Movimentação
                </button>

            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(function() {
            $('.select2').select2({
                placeholder: "Digite para buscar a peça",
                allowClear: true,
                width: '100%'
            });
        });
    </script>

</body>
</html>
