<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; } .container { max-width: 600px; } </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="container w-full">
        
        <div class="bg-white p-8 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ titulo }}</h1>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <!-- Renderiza o formulário padrão do Django com estilo -->
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                        {{ field }}
                        <div class="text-xs text-gray-500 mt-1">{{ field.help_text }}</div>
                        {% if field.errors %}
                            <div class="text-red-500 text-xs mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="pt-4 flex gap-3">
                    <a href="{% url 'listar_usuarios' %}" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-lg text-center transition">
                        Cancelar
                    </a>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition">
                        Registrar
                    </button>
                </div>
            </form>
        </div>

    </div>
    
    <style>
        /* Estiliza os inputs padrão do Django */
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
        }
    </style>
</body>
</html>
